; Viceroy on the Teensy 4.1 -- PlatformIO project.
;
; The game core (sim + composers + GameShell) is the SAME platform-free C++17
; the desktop players use; this project adds the bare-metal frontend: an
; ILI9341 320x240 SPI display (the 320x200 screen letterboxed), a USB-host
; keyboard + GPIO buttons, SD-card data (newlib syscalls bridged to SdFat so
; std::ifstream reads the card transparently), and PSRAM-backed allocation.
;
; HARDWARE (see README.md): Teensy 4.1 + soldered PSRAM (8 MB minimum,
; 2x8 MB recommended) + ILI9341 SPI TFT + microSD card carrying the game
; data (the Viceroy player package minus the .exe).
;
; Build: pio run          Flash: pio run -t upload
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_unflags = -fno-exceptions -fno-rtti -std=gnu++14
build_flags =
    -std=gnu++17
    -fexceptions
    -frtti
    -DVICEROY_TEENSY=1
    -I../viceroy_cpp/include
    -I../viceroy_cpp
    -I../viceroy_cpp/forge
    -I../viceroy_cpp/sim
    -I../viceroy_cpp/third_party/stb
build_src_filter =
    +<*>
    +<../../viceroy_cpp/sim/*.cpp>
    +<../../viceroy_cpp/src/surface.cpp>
    +<../../viceroy_cpp/src/render.cpp>
    +<../../viceroy_cpp/src/mapview.cpp>
    +<../../viceroy_cpp/src/colony_screen.cpp>
    +<../../viceroy_cpp/src/native_assets.cpp>
    +<../../viceroy_cpp/src/popup_render.cpp>
    +<../../viceroy_cpp/src/mp.cpp>
    +<../../viceroy_cpp/src/pal.cpp>
    +<../../viceroy_cpp/src/image_io.cpp>
    +<../../viceroy_cpp/src/fab.cpp>
    +<../../viceroy_cpp/src/madspack.cpp>
    +<../../viceroy_cpp/src/ss.cpp>
    +<../../viceroy_cpp/src/ff.cpp>
    +<../../viceroy_cpp/src/pik.cpp>
    +<../../viceroy_cpp/forge/*.cpp>
    -<../../viceroy_cpp/forge/main.cpp>
    -<../../viceroy_cpp/forge/httpd.cpp>
    -<../../viceroy_cpp/forge/desktop.cpp>
    -<../../viceroy_cpp/forge/web_ui.cpp>
    +<../../viceroy_cpp/drydock/text/rec_text.cpp>
    +<../../viceroy_cpp/drydock/schema/schema.cpp>
    +<../../viceroy_cpp/drydock/pack/pack.cpp>
    +<../../viceroy_cpp/drydock/core/store.cpp>
