; Colopy serial digest shell — Teensy 4.1 (see README.md).
; The sim core and the sim data table build in; the ~220 KB display-text
; unit (colopy_text.c) is EXCLUDED — nothing in the core references it
; (enforced by tools/gen_c_data.py), which is what lets it live on SD
; or in flash later.
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_src_filter =
  +<*>
  +<../core/*.c>
  +<../data/colopy_data.c>
; Phase 7/8 display+input build: uncomment the units + defines below
; (requires the PSRAM fitted and the ILI9341_t3n library installed).
; The render/report/dialog units DO reference the display-text and menu
; tables, so those data units come back in for this build.
;  +<../render/*.c>
;  +<../game/*.c>
;  +<../data/colopy_text.c>
;  +<../data/colopy_ui.c>
build_flags =
  -I../core
  -I../data
  -std=gnu11
  -O2
;  -DCOLOPY_ILI9341
;  -DCOLOPY_USBHOST    ; + USB keyboard on the host port (USBHost_t36)
;  -I../render
;  -I../game
